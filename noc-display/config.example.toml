[rdp]
enabled = true
server = "192.168.10.50"
port = 3389
username = "display1"
# Mot de passe en clair ; supprimer cette ligne pour utiliser DPAPI.
password = 'REMPLACER_PAR_LE_MOT_DE_PASSE'
domain = ""
retry_seconds = 10
# Accepter le certificat non fiable (identité du serveur non vérifiée).
ignore_certificate_errors = true

[ui]
connecting_text = "Connexion en cours…"
disconnected_text = "Connexion interrompue"
error_text = "Connexion impossible"
reconnecting_text = "Nouvelle tentative dans {seconds} secondes"
development_exit_enabled = true

[manager]
# Heartbeat optionnel vers NOC Manager (visible sur /metrics) ; désactivé
# par défaut. Display n'a pas besoin de NOC Manager pour fonctionner.
enabled = false
host = "192.168.10.64"
port = 8080
heartbeat_seconds = 30
# Si activé : [rdp] server/port/password/ignore_certificate_errors ci-dessus
# sont ignorés et récupérés depuis Manager à chaque tentative de connexion,
# via le compte du kiosque portant EXACTEMENT le même nom que le compte
# Windows courant. Il suffit alors de garder rdp.enabled = true ci-dessus ;
# server/username/password peuvent rester vides.
provides_rdp = false
