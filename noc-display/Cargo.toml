[package]
description = "Remote session display for Norfair Operation Center"
name = "noc-display"
version = "0.3.7"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "noc-display"
path = "src/main.rs"

[features]
default = ["dev-escape"]
dev-escape = []


[dependencies]
serde = { version = "=1.0.197", features = ["derive"] }
toml = "=0.5.11"
# Only exception to this crate's zero-extra-dependency rule: a password
# flows through this parser (health.rs, RDP config fetched from NOC
# Manager) and a hand-rolled JSON unescaper is the wrong place to risk a
# subtle correctness bug.
serde_json = "=1.0.117"
windows = { version = "=0.52.0", features = [
    "implement",
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
    "Win32_Networking_WinHttp",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
