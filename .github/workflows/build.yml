name: Build NOC applications

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noc-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  summary:
    name: NOC build summary
    needs: [windows, linux, release]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Collect build results and write summary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" > jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > artifacts.json
          python3 scripts/write-summary.py jobs.json artifacts.json
      - name: Report summary collection failure
        if: failure()
        run: |
          echo '## NOC — récapitulatif indisponible' >> "$GITHUB_STEP_SUMMARY"
          echo 'La collecte des résultats a échoué. Consulter les jobs et leurs logs dans cette exécution.' >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: ${{ matrix.app }} / Windows Server ${{ matrix.server }} x64
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [noc-manager, noc-display]
        server: ['2012', '2016']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify suite and Cargo versions
        run: python scripts/check-versions.py
      - name: Install Rust compatible with Server 2012 and 2016
        shell: pwsh
        run: |
          rustup toolchain install 1.77.2 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, verify and package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -App '${{ matrix.app }}' -Server '${{ matrix.server }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows-server-${{ matrix.server }}-x64
          path: dist/${{ matrix.app }}-windows-server-${{ matrix.server }}-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload raw executable for the auto-updater
        if: matrix.server == '2012'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-exe
          path: dist/${{ matrix.app }}.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: [windows, linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: noc-*
          merge-multiple: true
          path: release-assets
      - name: Create release and attach all packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish-release.sh

  linux:
    name: NOC Agent / ${{ matrix.os }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify suite and Cargo versions
        run: python3 scripts/check-versions.py
      - name: Install build dependencies
        run: |
          # Pre-installed on the runner image, unused by this project (Firefox
          # Flatpak, never Chrome) : a transient hash mismatch on Google's
          # mirror shouldn't be able to fail our own apt-get update. The
          # source file's exact name varies by runner image, so match on
          # content instead of guessing the filename.
          sudo grep -rl 'dl.google.com' /etc/apt/sources.list.d/ /etc/apt/sources.list 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            desktop-file-utils
          rustup toolchain install stable --profile minimal
      - name: Build, verify and package
        run: bash scripts/build-linux.sh '${{ matrix.os }}'
      - uses: actions/upload-artifact@v4
        with:
          name: noc-agent-${{ matrix.os }}-x64
          path: dist/noc-agent-${{ matrix.os }}-x64.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Upload raw executable for the auto-updater
        uses: actions/upload-artifact@v4
        with:
          name: noc-agent-${{ matrix.os }}-x64-exe
          path: dist/noc-agent-${{ matrix.os }}-x64
          if-no-files-found: error
          retention-days: 30
