[package]
description = "Central kiosk administration for Norfair Operation Center"
name = "noc-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "noc-manager"
path = "src/main.rs"

# Versions pinned to stay buildable with Rust 1.77.2 (Windows Server 2012 target).
[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
